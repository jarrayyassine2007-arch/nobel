<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Présentation - Prix Nobel</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <h1>Formulaire de candidature - Prix Nobel</h1>
    <form>
      <fieldset>
        <legend>Inscription d'un client</legend>
        <label>Nom</label>
        <input type="text" id="nom" name="index" required /><br /><br />
        <label>Email </label>
        <input
          type="email"
          id="email"
          name="index"
          required
          placeholder="nom@serveur.domaine "
        /><br /><br />
        <label>Téléphone </label>
        <input type="tel" id="tel" name="index" required /><br /><br />
        <label>Genre </label><br /><br />
        <label class="rad">Homme</label>
        <input type="radio" id="homme" name="index" value="homme" selected />
        <label class="rad">Femme</label>
        <input type="radio" id="femme" name="index" value="femme" /><br /><br />
        <label>Âge </label>
        <input
          type="number"
          id="age"
          name="index"
          min="18"
          max="100"
        /><br /><br />
        <label>Date de naissance </label>
        <input type="date" id="date" name="index" /><br /><br />
        <label>Heure préférée de contact </label>
        <input type="time" id="time" name="index" /><br /><br />
        <label>Niveau d'expérience</label>
        <input type="range" id="p" name="index" min="5" max="15" />
        <output name="p"></output><br /><br />
        <label>Catégories qui vous intéressent</label><br /><br />
        <input type="checkbox" id="lit" name="index" value="lit" />
        <label>Littérature</label>
        <input type="checkbox" id="med" name="index" value="med" />
        <label>Medecine</label>
        <input type="checkbox" id="chimie" name="index" value="chimie" />
        <label>Chimie</label>
        <input type="checkbox" id="phy" name="index" value="phy" />
        <label>Physique</label>
        <input type="checkbox" id="paix" name="index" value="paix" />
        <label>Paix</label>
        <input type="checkbox" id="eco" name="index" value="Eco" />
        <label>Sciences Economiques</label><br /><br /><br />
        <label>Pays </label>
        <select id="pays" name="index" size="3">
          <option value="fr">France</option>
          <option value="tn">Tunisie</option>
          <option value="us">États-Unis</option></select
        ><br /><br /><br />
        <label>Ville</label>
        <input list="vil" id="ville" name="index" disabled />
        <datalist id="vil">
          <option value="Paris" selected></option>
          <option value="Tunis"></option>
          <option value="Stockholm"></option></datalist
        ><br /><br />
        <label>Votre projet </label><br />
        <textarea id="pro" name="index" rows="5" cols="40"></textarea><br />
      </fieldset>
      <fieldset>
        <legend>Identification</legend>
        <label>N° Inscription</label>
        <input
          type="text"
          readonly
          name="index"
          placeholder="Num-Ins"
        /><br /><br />
        <label>Mot de passe </label>
        <input type="password" name="index" required /><br /><br />
        <label>Confirmation du mot de passe </label>
        <input type="password" name="index" required /><br /><br />
        <input class="but" name="index" type="submit" value="Envoyer" />
        <input class="but" name="index" type="reset" value="Annuler" />
      </fieldset>
    </form>
  </body>
</html>
